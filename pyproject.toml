[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cent"
version = "6.0.0.dev0"
description = "Python SDK for Centrifugo's HTTP server API: API client, tokens, proxy handlers"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Centrifugal Labs LTD" }]
requires-python = ">=3.11"
dependencies = ["httpx2>=2.16"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

[project.optional-dependencies]
# RSA, ECDSA and Ed25519 tokens; HMAC tokens need nothing.
crypto = ["cryptography>=42"]

[project.urls]
Homepage = "https://github.com/centrifugal/pycent"
Documentation = "https://centrifugal.dev/docs/server/server_api"
Changelog = "https://github.com/centrifugal/pycent/blob/master/CHANGELOG.md"

[dependency-groups]
dev = [
    "cryptography>=42",
    # httpx itself only for the test refusing its clients with the fix.
    "httpx",
    "mypy>=1.13",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.hatch.build.targets.sdist]
include = ["cent", "proto", "gen", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["cent"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF", "PT", "ASYNC", "PIE", "RET", "PL"]
ignore = [
    "PLR0911", # too many returns: decoders and error mapping are flat on purpose
    "PLR0912", # too many branches
    "PLR0913", # too many arguments: client options are keyword-only
    "PLR0915", # too many statements
    "PLR2004", # magic values: HTTP statuses and error codes read best as numbers
    # A timeout parameter on async functions: asyncio code cannot read the
    # deadline of an enclosing asyncio.timeout, so a call takes its own, as in
    # httpx; an outer asyncio.timeout still ends it sooner.
    "ASYNC109",
    "RUF001", "RUF002", "RUF003", # ambiguous characters in strings and docs
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLC0415", "S311"]
"cent/_api.py" = ["E501", "RUF100"]
"gen/**" = ["S101", "PLC0415", "E501"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["cent", "tests", "gen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: needs a running Centrifugo (see testdata/)"]
addopts = "-m 'not integration'"
